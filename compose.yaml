services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: teamup
      MYSQL_USER: teamup
    env_file:
      - path: .env.docker
        format: raw
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - path: .env.docker
        format: raw
    volumes:
      - ./.env:/app/.env:ro
    environment:
      DB_URL: jdbc:mysql://db:3306/teamup
      SPRING_PROFILES_ACTIVE: oauth
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
